<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family:"Noto SC"; src:url("fonts/noto-sc-400.woff2") format("woff2"); font-weight:400; }
  @font-face { font-family:"Noto SC"; src:url("fonts/noto-sc-700.woff2") format("woff2"); font-weight:700; }
  * { margin:0; padding:0; box-sizing:border-box; }
  /* 竖版封面：画布换成 1080×1440，元素位置全部重排，不是等比缩放 */
  body { width:1080px; height:1440px; overflow:hidden; font-family:"Noto SC",sans-serif; background:#0D1B2A; }
  .cover { width:1080px; height:1440px; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse 60% 35% at 80% 12%, rgba(247,127,0,.14), transparent 60%),
      radial-gradient(ellipse 55% 40% at 12% 88%, rgba(42,157,143,.12), transparent 60%),
      linear-gradient(160deg,#0D1B2A 0%, #13283F 55%, #0D1B2A 100%);
  }
  .glass { position:absolute; inset:40px; border-radius:32px; border:1px solid rgba(255,255,255,.08);
    background:rgba(27,42,62,.45); box-shadow:0 24px 70px rgba(0,0,0,.5); }
  .tag { position:absolute; top:150px; font-size:34px; letter-spacing:6px; color:#FCBF49; font-weight:700; text-align:center; width:100%; }
  .tag2 { position:absolute; top:216px; font-size:24px; letter-spacing:3px; color:#8D99AE; text-align:center; width:100%; }
  .bar { position:absolute; top:290px; width:90px; height:7px; background:#F77F00; border-radius:4px; }
  .num { position:absolute; top:400px; font-size:250px; font-weight:700; color:#E0E1DD; line-height:1; font-variant-numeric:tabular-nums; }
  .pct { position:absolute; top:700px; font-size:150px; font-weight:700; color:#E63946; font-variant-numeric:tabular-nums; }
  .sub { position:absolute; top:920px; font-size:46px; color:#E0E1DD; font-weight:700; text-align:center; width:900px; line-height:1.4; }
  .badge { position:absolute; top:1120px; font-size:28px; color:#2A9D8F; border:2px solid #2A9D8F; padding:10px 32px; border-radius:44px; letter-spacing:2px; }
</style>
</head>
<body>
  <div class="cover">
    <div class="glass"></div>
    <div class="tag">{{SERIES_TAG}}</div>
    <div class="tag2">{{KICKER}}</div>
    <div class="bar"></div>
    <div class="num">{{BIG_NUMBER}}</div>
    <div class="pct">{{BIG_PCT}}</div>
    <div class="sub">{{SUB_LINE}}</div>
    <div class="badge">{{BADGE}}</div>
  </div>
</body>
</html>
