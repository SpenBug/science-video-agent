<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kokoro 中文配音试听</title>
<style>
  /* 选音色的工具页。渲染正式片子之前先在这里听一遍，
     同一句话放 8 个中文音色，点播放对比，定了音色再跑 gen_tts_html.py。 */
  body { background:#0D1B2A; color:#E0E1DD; font-family:"PingFang SC","Microsoft YaHei",sans-serif; margin:0; padding:28px; }
  h1 { font-size:22px; margin:0 0 6px; }
  .sub { color:#8D99AE; font-size:14px; margin-bottom:20px; }
  .group { margin:18px 0 8px; font-size:15px; color:#FCBF49; font-weight:700; }
  .row { display:flex; align-items:center; gap:14px; padding:10px 14px; border-radius:10px; background:#1B2A3E; margin-bottom:8px; max-width:820px; }
  .row .name { width:150px; font-weight:700; font-size:15px; }
  .row .meta { width:210px; color:#8D99AE; font-size:13px; }
  .row .cur { font-size:12px; color:#F77F00; border:1px solid #F77F00; padding:1px 8px; border-radius:20px; }
  audio { height:36px; }
  .note { margin-top:22px; color:#8D99AE; font-size:13px; max-width:820px; line-height:1.7; }
</style>
</head>
<body>
  <h1>Kokoro 中文配音试听</h1>
  <div class="sub">同一句话 · 8 个中文声音 · 点播放对比</div>

  <!-- 试听用的 mp3 放同级 voice_demo/ 目录，命名 = 音色名 -->
  <div class="group">🚺 女声（4 个）</div>
  <div class="row"><div class="name">zf_xiaobei</div><div class="meta">温柔女声 · 约 231Hz</div><audio controls preload="none" src="/voice_demo/zf_xiaobei.mp3"></audio></div>
  <div class="row"><div class="name">zf_xiaoni</div><div class="meta">清新女声 · 约 200Hz</div><audio controls preload="none" src="/voice_demo/zf_xiaoni.mp3"></audio></div>
  <div class="row"><div class="name">zf_xiaoxiao</div><div class="meta">标准普通话女声 · 约 200Hz</div><audio controls preload="none" src="/voice_demo/zf_xiaoxiao.mp3"></audio></div>
  <div class="row"><div class="name">zf_xiaoyi</div><div class="meta">甜美女声</div><audio controls preload="none" src="/voice_demo/zf_xiaoyi.mp3"></audio></div>

  <div class="group">🚹 男声（4 个）</div>
  <div class="row"><div class="name">zm_yunjian</div><div class="meta">沉稳播音男声 · 约 99Hz</div><span class="cur">推荐</span><audio controls preload="none" src="/voice_demo/zm_yunjian.mp3"></audio></div>
  <div class="row"><div class="name">zm_yunxi</div><div class="meta">青年男声 · 约 164Hz</div><audio controls preload="none" src="/voice_demo/zm_yunxi.mp3"></audio></div>
  <div class="row"><div class="name">zm_yunxia</div><div class="meta">男声</div><audio controls preload="none" src="/voice_demo/zm_yunxia.mp3"></audio></div>
  <div class="row"><div class="name">zm_yunyang</div><div class="meta">男声</div><audio controls preload="none" src="/voice_demo/zm_yunyang.mp3"></audio></div>

  <div class="note">定了音色告诉编号，用 <code>gen_tts_html.py &lt;项目根&gt; &lt;音色&gt; &lt;语速&gt;</code> 重新合成即可，不用重做画面。</div>
</body>
</html>
